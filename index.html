<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Día de las Flores Amarillas23342234</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 50% 100%, #1a331a 0%, #081008 50%, #030503 100%);
            color: white;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        #stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background-color: #fffbcf;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle var(--duration) ease-in-out infinite;
            animation-delay: var(--delay);
        }

        @keyframes twinkle {
    0%, 100% { opacity: 0; }
    50% { opacity: 0.8; }
}

        .text-container {
            z-index: 20;
            text-align: center;
            margin-top: 6vh;
            pointer-events: none;
            animation: fadeInDown 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .main-title {
            font-family: 'Dancing Script', cursive;
            font-size: 3.6rem;
            color: #ffe600;
            text-shadow: 
                0 0 10px rgba(255, 230, 0, 0.8),
                0 0 20px rgba(255, 193, 7, 0.6),
                0 0 35px rgba(255, 152, 0, 0.5);
            line-height: 1.15;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 1.25rem;
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Contenedor que hace emerger el ramo desde abajo */
        .bouquet-emergence-wrapper {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%) translateY(100%);
            z-index: 10;
            animation: growFromBottom 2.2s cubic-bezier(0.17, 0.89, 0.32, 1.1) 0.3s 1 forwards;
            transform-origin: bottom center;
        }

        /* Contenedor interno que aplica el movimiento oscilante de viento */
        .bouquet-sway-wrapper {
            transform-origin: bottom center;
            animation: swayMotion 4.5s ease-in-out infinite alternate;
            animation-delay: 2.5s;
        }

        @keyframes growFromBottom {
            0% {
                transform: translateX(-50%) translateY(110%) scale(0.6);
                opacity: 0;
            }
            100% {
                transform: translateX(-50%) translateY(0) scale(1);
                opacity: 1;
            }
        }

        @keyframes swayMotion {
            0% { transform: rotate(-3.5deg) translateX(-5px); }
            50% { transform: rotate(1deg); }
            100% { transform: rotate(3.5deg) translateX(5px); }
        }

        .bouquet-svg {
            /* Se adapta automáticamente al ancho Y al alto de la pantalla */
            width: min(90vw, 55vh, 480px);
            height: auto;
            aspect-ratio: 500 / 650;
            display: block;
            filter: drop-shadow(0 15px 25px rgba(255, 230, 0, 0.8));
        }

        .butterfly-glow {
            position: absolute;
            z-index: 15;
            pointer-events: none;
            filter: drop-shadow(0 0 6px #ffe600);
            animation: floatButterfly 5s ease-in-out infinite alternate;
        }

        .butterfly-left-bottom {
            bottom: 120px;
            left: 8vw;
            width: 55px;
            height: 55px;
            transform: rotate(-15deg);
        }

        .butterfly-right-middle {
            top: 45%;
            right: 8vw;
            width: 50px;
            height: 50px;
            transform: rotate(20deg);
            animation-delay: -2s;
        }

        .butterfly-top-right {
            top: 15%;
            right: 22vw;
            width: 42px;
            height: 42px;
            transform: rotate(-30deg);
            animation-delay: -3.5s;
        }

        @keyframes floatButterfly {
            0% { transform: translateY(0) rotate(-10deg) scale(1); }
            100% { transform: translateY(-18px) rotate(10deg) scale(1.08); }
        }

        .grass-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 180px;
            z-index: 2;
            pointer-events: none;
        }

        .action-btn-container {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 30;
        }

        .envelope-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffe600 0%, #d4a000 100%);
            border: 2px solid #ffffff;
            box-shadow: 0 0 20px rgba(255, 230, 0, 0.8), 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
        }

        .envelope-btn:hover {
            transform: scale(1.12) rotate(5deg);
            box-shadow: 0 0 30px rgba(255, 230, 0, 1), 0 6px 15px rgba(0,0,0,0.6);
        }

        .envelope-btn svg {
            width: 32px;
            height: 32px;
            fill: #221500;
        }

        /* Cinta frontal del ramo */
        #front-wrapper {
            filter: drop-shadow(0 5px 5px rgba(0, 0, 0, 0.22));
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: linear-gradient(135deg, #1f2d1f 0%, #0d170d 100%);
            border: 2px solid #ffe600;
            border-radius: 20px;
            padding: 30px;
            max-width: 88vw;
            width: 380px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 230, 0, 0.4);
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-card h2 {
            font-family: 'Dancing Script', cursive;
            color: #ffe600;
            font-size: 2.2rem;
            margin-bottom: 12px;
        }

        .modal-card p {
            color: #f0f0f0;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .modal-close-btn {
            background: #ffe600;
            color: #1a1a00;
            border: none;
            padding: 10px 24px;
            font-weight: 700;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: background 0.2s;
        }

        .modal-close-btn:hover {
            background: #fff;
        }

        @media (max-width: 600px) {
            body {
                min-height: 100vh;
                min-height: 100dvh;
                height: 100vh;
                height: 100dvh;
            }

            .text-container {
                margin-top: clamp(16px, 5vh, 45px);
                padding: 0 12px;
            }

            .main-title {
                font-size: clamp(2rem, 9vw, 2.7rem);
                line-height: 1.05;
                margin-bottom: 5px;
            }

            .subtitle {
                font-size: clamp(0.82rem, 3.8vw, 1.05rem);
            }

            .bouquet-emergence-wrapper {
                bottom: clamp(-18px, -2vh, -5px);
            }

            .bouquet-svg {
                width: min(90vw, 55vh, 480px);
                height: auto;
            }

            .action-btn-container {
                bottom: max(14px, env(safe-area-inset-bottom));
                right: max(14px, env(safe-area-inset-right));
            }

            #front-wrapper text {
                font-size: clamp(22px, 5.5vw, 28px);
            }

            .envelope-btn {
                width: clamp(50px, 14vw, 60px);
                height: clamp(50px, 14vw, 60px);
            }

            .envelope-btn svg {
                width: clamp(24px, 7vw, 30px);
                height: clamp(24px, 7vw, 30px);
            }

            .modal-card {
                width: min(88vw, 380px);
                padding: clamp(20px, 6vw, 30px);
            }

            .modal-card h2 {
                font-size: clamp(1.8rem, 8vw, 2.2rem);
            }
        }

        /* Celulares en horizontal y laptops con poca altura */
        @media (max-height: 700px) {
            .text-container {
                margin-top: 2vh;
            }

            .main-title {
                font-size: clamp(1.8rem, 6vh, 3rem);
            }

            .subtitle {
                font-size: clamp(0.75rem, 2.4vh, 1rem);
            }

            .bouquet-svg {
                width: min(72vw, 58vh, 440px);
            }

            .grass-container {
                height: 120px;
            }

            .action-btn-container {
                bottom: 12px;
                right: 12px;
            }
        }

        /* Pantallas muy estrechas */
        @media (max-width: 360px) {
            .main-title {
                font-size: 1.85rem;
            }

            .subtitle {
                font-size: 0.78rem;
            }

            .bouquet-svg {
                width: min(92vw, 52vh, 340px);
            }
        }
    </style>
</head>

    <script>
        // 1. Generador dinámico de estrellas parpadeantes en el fondo
        function generateStarrySky() {
    const starsContainer = document.getElementById('stars-container');
    if (!starsContainer) return;
    
    // Reducimos el número de elementos para no saturar celulares
    const totalStars = window.innerWidth < 600 ? 40 : 80;

    const fragment = document.createDocumentFragment();

    for (let i = 0; i < totalStars; i++) {
        const star = document.createElement('div');
        star.classList.add('star');

        const posX = Math.random() * 100;
        const posY = Math.random() * 100;
        const size = Math.random() * 2 + 1;

        star.style.left = `${posX}%`;
        star.style.top = `${posY}%`;
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;

        const duration = Math.random() * 3 + 2;
        const delay = Math.random() * 3;
        star.style.setProperty('--duration', `${duration}s`);
        star.style.setProperty('--delay', `${delay}s`);

        fragment.appendChild(star);
    }
    
    starsContainer.appendChild(fragment);
}

        // 2. Control del Modal de Mensaje
        function setupModalEvents() {
            const openBtn = document.getElementById('openModalBtn');
            const closeBtn = document.getElementById('closeModalBtn');
            const modal = document.getElementById('messageModal');

            openBtn.addEventListener('click', () => {
                modal.classList.add('active');
            });

            closeBtn.addEventListener('click', () => {
                modal.classList.remove('active');
            });

            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            });
        }

        // Inicializar cuando el DOM esté listo
        window.addEventListener('DOMContentLoaded', () => {
            generateStarrySky();
            setupModalEvents();
        });
    </script>
